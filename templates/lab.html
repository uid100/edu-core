<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bundle.css">
    <link rel="stylesheet" href="https://uid100.github.io/timeline/css/timeline.css">

    <!-- Query parameter loader -->
    <!-- <script src="../js/query.js"></script> -->

    <!-- Canvas:

<body>
    <a id="top" tabindex="-1"></a>

    <div id="labpage" class="container mt-3">

        <div id="page-header">
            <div class="row">
                <div class="col-6 text-start">
                    <a id="college-link" href="#" target="_blank">
                        <img id="college-logo" class="logo" src="" alt="College Logo" />
                    </a>
                </div>
                <div class="col-6 text-end">
                    <figure>
                        <img id="cover-image" src="" alt="cover page image" />
                    </figure>
                </div>
            </div>

            <div class="row">
                <div class="timeline" id="timeline">
                    <div class="line"></div>
                    <div id="start-marker" class="marker"></div>
                    <div id="end-marker" class="marker"></div>
                    <div id="current-marker" class="marker current-marker"></div>

                    <div id="start-label" class="timeline-label"></div>
                    <div id="end-label" class="timeline-label"></div>
                    <div id="current-label" class="timeline-label current"></div>
                </div>
            </div>
        </div> <!-- #page-header -->

        <h2 id="lab-title" class="mt-4">Lab Title Placeholder</h2>
        <p class=".boxed-paragraph">
            Be sure to expand each section to view the full assignment details and instructions.
        </p>
        <div class="accordion mb-4" id="labAccordionContainer">
            <div class="accordion-item">
                <h2 class="accordion-header" id="overviewHeading">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#overviewCollapse" aria-expanded="true" aria-controls="overviewCollapse">
                        Assignment Overview & Objectives
                    </button>
                </h2>
                <div id="overviewCollapse" class="accordion-collapse collapse show"
                    aria-labelledby="overviewHeading" data-bs-parent="#labAccordionContainer">
                    <div class="accordion-body" id="overview-content">
                        <!-- Placeholder: course-specific overview injected by course repo -->
                        <p><em>Overview, background, and objectives will be loaded here.</em></p>
                    </div>
                </div>
            </div>
        </div> <!-- end accordion -->
    </div> <!-- end container -->

    <script type="module" src="../js/renderer.js"></script>
    <script type="module" src="../js/lab.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
