<body>
    <a id="top" tabindex="-1"></a>

    <div id="contentpage" class="container mt-3">

        <div id="page-header">
            <div class="row">
                <div class="col-6 text-start">
                    <a id="college-link" href="#" target="_blank">
                        <img id="college-logo" class="logo" src="" alt="College Logo" />

                <div class="timeline" id="timeline">
                    <div class="line"></div>
                    <div id="start-marker" class="marker"></div>

                    <div id="start-label" class="timeline-label"></div>

                    <div id="current-label" class="timeline-label current"></div>
                </div>
            </div>

        <div id="title" class="py-3">

        </div> <!-- End Topic Title -->

        <div id="topicContainer" class="px-3"></div>
    </div> <!-- end container -->

    <script type="module" src="../js/renderer.js"></script>
    <script type="module" src="../js/content-loader.js"></script>
    <script type="module" src="../js/topic.js"></script>
