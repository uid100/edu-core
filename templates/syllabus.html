<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bundle.css">
    <link rel="stylesheet" href="https://uid100.github.io/timeline/css/timeline.css">
    <!-- homepage 
    <p>
      <iframe 
        src="https://uid100.github.io/edu-core/templates/syllabus.html?course=palomar-csit175" 
        width="100%" height="1000px" loading="lazy">
      </iframe>
    </p>
    -->
</head>

<body>
    <div id="top"></div> <!-- #top -->
    <div id="syllabus-page" class="container-fluid">
        <h2 style="display: none;">page header</h2>
        <div id="page-header">
            <div class="row">
                <div class="col-6 text-start">
                        <a id="college-link" href="#" target="_blank">
                        <img id="college-logo" class="logo" src="" alt="College Logo" />
                    </a> <!-- #college-link -->
                </div> <!-- .col-6 -->
                <div class="col-6 text-end">
                    <figure><img id="cover-image" src="" alt="cover page image" />
                    </figure>
                </div> <!-- .col-6 -->
            </div> <!-- .row -->
            <div class="row">
                <div class="timeline" id="timeline">
                    <div class="line"></div>
                    <div id="start-marker" class="marker"></div>
                    <div id="end-marker" class="marker"></div>
                    <div id="current-marker" class="marker current-marker"></div>

                    <div id="start-label" class="timeline-label"></div>
                    <div id="end-label" class="timeline-label"></div>
                    <div id="current-label" class="timeline-label current"></div>
                </div> <!-- #timeline -->
            </div> <!-- .row -->
        </div> <!-- #page-header -->
        <h2 id="course-title">Syllabus</h2>

        <div id="section" class="card mx-auto">
            <div class="card-body">
                <h3 class="card-title" id="course-term"> Term </h3>
                <p class="card-text">
                <ul>
                    <li id="schedule"></li>
                    <li id="location"></li>
                    <li id="hyflex" style="display: none;"></li>
                </ul>
                </p>
            </div> <!-- .card-body -->
        </div> <!-- #section -->

        <div id="about-course" class="card mx-auto">
            <div class="card-body">
                <h3 class="card-title" id="course-number">About</h3>
                <p class="card-text" id="course-about">
                    <!--This course is an introduction to programming. We will cover the
                    basics of programming, including variables, data types, control structures, and functions. We will
                    also cover more advanced topics such as object-oriented programming and data structures.-->
                </p>
                <figure>
                    <img id="textbook-image" class="rounded" src="../images/web_content.jpg"
                        alt="Textbook Image" />
                    <figcaption style="text-align: center;" id="textbook-title">
                    </figcaption>
                </figure>
            </div> <!-- .card-body -->
        </div> <!-- #about-course -->

        <div id="footer">
            <a href="#top">Back to Top</a>
        </div> <!-- #footer -->
    </div> <!-- #syllabus-page -->

    <script type="module" src="../js/renderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
